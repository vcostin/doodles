<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magma Cracks</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1d12; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #err { position: fixed; inset: 0; display: none; place-items: center; color: #f3d9b1;
         font: 14px/1.4 system-ui, sans-serif; text-align: center; padding: 16px; }
  #back { position: fixed; top: 14px; left: 16px; color: rgba(241,228,210,.55); text-decoration: none;
          font: 13px/1 system-ui, sans-serif; letter-spacing: .02em; transition: color .15s; }
  #back:hover, #back:focus-visible { color: rgba(241,228,210,.95); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<a id="back" href="../">← Doodles</a>
<div id="err">WebGL2 is required for this demo.</div>

<script id="vs" type="x-shader/x-vertex">#version 300 es
in vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
</script>

<!-- Shared noise helpers, prepended to both fragment shaders -->
<script id="common" type="x-shader/x-fragment">
vec2 hash2(vec2 p) {
  p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
  return fract(sin(p) * 43758.5453);
}
float hash1(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash1(i), b = hash1(i + vec2(1, 0)), c = hash1(i + vec2(0, 1)), d = hash1(i + vec2(1, 1));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
float fbm(vec2 p) {
  float s = 0.0, a = 0.5;
  mat2 r = mat2(0.8, -0.6, 0.6, 0.8);
  for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = r * p * 2.03 + 11.7; a *= 0.5; }
  return s;
}
</script>

<!--
  Pass 1: plate-motion field (low-res texture over the square).
  R = crack intensity I, GB = rigid plate displacement (uv), encoded around 0.5.
-->
<script id="fs-field" type="x-shader/x-fragment">
#define MAX_PTS 96
uniform vec2  uFieldRes;
uniform float uTime;
uniform vec4  uPts[MAX_PTS];  // xy: square-local uv, z: life 0..1, w: radius
uniform vec4  uVel[MAX_PTS];  // xy: elastic drag toward the live cursor (uv)
uniform int   uCount;
out vec4 fragColor;

const float PUSH = 0.026;   // how far plates are shoved away from the cursor (uv)
const float DRANGE = 0.07;  // encoding range for displacement
const float FM = 0.15;      // field covers [-FM, 1+FM] so rim plates can move out over the mud

void main() {
  vec2 lp = gl_FragCoord.xy / uFieldRes * (1.0 + 2.0 * FM) - FM;
  float act = 0.0;          // generous mask: where plates may be moving at all
  float keep = 1.0;
  vec2 push = vec2(0.0), drag = vec2(0.0);
  float wsum = 0.0;
  float wob = vnoise(lp * 7.0 + uTime * 0.25) - 0.5;
  for (int i = 0; i < MAX_PTS; i++) {
    if (i >= uCount) break;
    vec4 P = uPts[i];
    vec2 d = lp - P.xy;
    float f = smoothstep(P.w, 0.0, length(d) * (1.0 + 0.45 * wob));
    f = f * f * (3.0 - 2.0 * f);
    float c = P.z * f;
    keep *= 1.0 - c;
    // push uses its own softer, wider falloff so plates around a resting cursor still part visibly
    float fp = P.z * smoothstep(P.w * 1.3, 0.0, length(d));
    push += d / (length(d) + 0.03) * fp;  // away from the point
    drag += uVel[i].xy * c;               // toward the live cursor
    wsum += c;
    act = max(act, step(length(d), P.w * 1.6 + 0.22));
  }
  float I = 1.0 - keep;
  vec2 disp = clamp((push * PUSH + drag) / max(wsum, 1.0) * I, -DRANGE, DRANGE);
  fragColor = vec4(I, disp / (2.0 * DRANGE) + 0.5, act);
}
</script>

<!-- Pass 2: mud + slab made of rigid plates; magma fills the gaps between them -->
<script id="fs" type="x-shader/x-fragment">
uniform vec2  uRes;
uniform vec3  uSq;         // square center (px, GL coords) + half size (px)
uniform float uTime;
uniform sampler2D uField;
out vec4 fragColor;

const float DRANGE = 0.07;
const float FM = 0.15;
const float S = 7.0;       // plates across the slab

vec4 fieldRaw(vec2 uv) { return texture(uField, clamp((uv + FM) / (1.0 + 2.0 * FM), 0.0, 1.0)); }
vec3 field(vec2 uv) {      // xy: displacement (uv), z: intensity
  vec4 f = fieldRaw(uv);
  return vec3((f.gb - 0.5) * 2.0 * DRANGE, f.r);
}
float sdBox(vec2 p) {      // signed distance to the slab footprint (uv)
  vec2 q = abs(p - 0.5) - 0.5;
  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0);
}

float voronoiEdge(vec2 x) {   // distance to nearest Voronoi border (IQ)
  vec2 n = floor(x), f = fract(x);
  vec2 mg, mr; float md = 8.0;
  for (int j = -1; j <= 1; j++)
  for (int i = -1; i <= 1; i++) {
    vec2 g = vec2(float(i), float(j));
    vec2 r = g + 0.15 + 0.7 * hash2(n + g) - f;
    float d = dot(r, r);
    if (d < md) { md = d; mr = r; mg = g; }
  }
  md = 8.0;
  for (int j = -2; j <= 2; j++)
  for (int i = -2; i <= 2; i++) {
    vec2 g = mg + vec2(float(i), float(j));
    vec2 r = g + 0.15 + 0.7 * hash2(n + g) - f;
    if (dot(mr - r, mr - r) > 1e-5) md = min(md, dot(0.5 * (mr + r), normalize(r - mr)));
  }
  return md;
}

float voronoiEdgeFree(vec2 x) {   // same, full site jitter -> less uniform cells
  vec2 n = floor(x), f = fract(x);
  vec2 mg, mr; float md = 8.0;
  for (int j = -1; j <= 1; j++)
  for (int i = -1; i <= 1; i++) {
    vec2 g = vec2(float(i), float(j));
    vec2 r = g + hash2(n + g) - f;
    float d = dot(r, r);
    if (d < md) { md = d; mr = r; mg = g; }
  }
  md = 8.0;
  for (int j = -2; j <= 2; j++)
  for (int i = -2; i <= 2; i++) {
    vec2 g = mg + vec2(float(i), float(j));
    vec2 r = g + hash2(n + g) - f;
    if (dot(mr - r, mr - r) > 1e-5) md = min(md, dot(0.5 * (mr + r), normalize(r - mr)));
  }
  return md;
}

// ---------- mud ----------
float mudHeight(vec2 p) {
  return fbm(p * 2.2) + 0.35 * fbm(p * 7.0 + 3.1) + 0.10 * vnoise(p * 40.0);
}
vec3 mud(vec2 fragPx) {
  vec2 p = fragPx / min(uRes.x, uRes.y) * 3.0;
  float e = 0.004;
  float h = mudHeight(p), hx = mudHeight(p + vec2(e, 0.0)), hy = mudHeight(p + vec2(0.0, e));
  vec3 n = normalize(vec3((h - hx) / e * 0.06, (h - hy) / e * 0.06, 1.0));
  float tone = fbm(p * 0.9 + 7.0);
  vec3 col = mix(vec3(0.14, 0.095, 0.06), vec3(0.30, 0.21, 0.12), smoothstep(0.25, 0.65, h));
  col = mix(col, vec3(0.43, 0.32, 0.18), smoothstep(0.55, 0.85, tone) * 0.55);
  float wet = smoothstep(0.42, 0.30, h + 0.15 * (tone - 0.5));
  col = mix(col, col * 0.55, wet);
  vec3 L = normalize(vec3(-0.5, 0.6, 0.65));
  float diff = clamp(dot(n, L), 0.0, 1.0);
  col *= 0.55 + 0.6 * diff;
  vec3 H = normalize(L + vec3(0.0, 0.0, 1.0));
  col += vec3(0.85, 0.75, 0.6) * pow(clamp(dot(n, H), 0.0, 1.0), mix(18.0, 90.0, wet)) * mix(0.04, 0.35, wet);
  float peb = smoothstep(0.86, 0.9, vnoise(p * 22.0 + 5.0)) * smoothstep(0.4, 0.7, h);
  col = mix(col, vec3(0.38, 0.33, 0.27) * (0.6 + 0.6 * diff), peb * 0.6);
  vec2 q = fragPx / uRes - 0.5;
  return col * (1.0 - 0.88 * dot(q, q));
}

// ---------- magma ramp: t = 0 gap center (hot) -> 1 gap margin (dark) ----------
vec3 magmaRamp(float t, float heat) {
  t = clamp(t + (1.0 - heat) * 0.55, 0.0, 1.0);
  vec3 c = mix(vec3(1.00, 0.93, 0.62), vec3(1.00, 0.68, 0.16), smoothstep(0.00, 0.22, t));
  c = mix(c, vec3(0.95, 0.32, 0.03), smoothstep(0.18, 0.48, t));
  c = mix(c, vec3(0.50, 0.05, 0.01), smoothstep(0.45, 0.78, t));
  c = mix(c, vec3(0.10, 0.01, 0.00), smoothstep(0.72, 1.00, t));
  return c;
}

void main() {
  vec2 frag = gl_FragCoord.xy;
  vec2 lp = (frag - (uSq.xy - uSq.z)) / (2.0 * uSq.z);   // square-local uv, y up
  float px = 1.0 / (2.0 * uSq.z);
  vec2 dq = abs(lp - 0.5) - 0.5;
  float sdSq = length(max(dq, 0.0)) + min(max(dq.x, dq.y), 0.0);
  float inside = 1.0 - smoothstep(-px, px, sdSq);

  vec3 mudC = inside < 1.0 ? mud(frag) : vec3(0.0);
  vec3 col;

  vec4 F0 = sdSq < 0.14 ? fieldRaw(lp) : vec4(0.0);
  if (F0.a < 0.5) {
    // untouched: plain slab with a soft contact shadow
    col = mix(mudC * mix(0.45, 1.0, smoothstep(0.0, 0.06, sdSq)), vec3(0.0), inside);
    fragColor = vec4(pow(col, vec3(0.92)), 1.0);
    return;
  }
  float I = F0.r;

  // Static (cursor-independent) warp gives plates jagged, organic outlines.
  vec2 W = 0.42 * vec2(fbm(lp * 4.0), fbm(lp * 4.0 + 5.2)) - 0.21
         + 0.16 * vec2(fbm(lp * 14.0 + 2.0), fbm(lp * 14.0 + 9.0)) - 0.08
         + 0.07 * vec2(vnoise(lp * 40.0), vnoise(lp * 40.0 + 7.0)) - 0.035;
  vec2 X = lp * S + W;
  vec2 n = floor(X);
  float pxL0 = px * S;

  // Only sites inside the footprint are plates; outer cells simply extend to the rim.
  // (No padding plates -> no crack running parallel to the edge.)
  vec2 site[25];
  float ok_[25];
  for (int j = -2; j <= 2; j++)
  for (int i = -2; i <= 2; i++) {
    vec2 g = n + vec2(float(i), float(j));
    vec2 sp = g + 0.1 + 0.8 * hash2(g);
    int id = (j + 2) * 5 + (i + 2);
    site[id] = sp;
    vec2 su = sp / S;
    ok_[id] = step(0.0, su.x) * step(su.x, 1.0) * step(0.0, su.y) * step(su.y, 1.0);
  }

  // Each plate = (its Voronoi cell ∩ the slab footprint), rigidly translated by the field at its site.
  // Rim plates can therefore slide out over the mud or pull in from the edge: the margin mutates.
  float sd1 = 1e3, sd2 = 1e3;   // signed distance to nearest / second plate (lattice units)
  vec2 o1 = vec2(0.0), o2 = vec2(0.0);
  vec2 s1 = vec2(0.0), s2 = vec2(1.0);
  float clip1 = 1e3, clip2 = 1e3;   // distance to each nearest plate's moved footprint box
  float sdV1 = 1e3;                 // Voronoi-only distance (footprint clip ignored)
  float rimEdge1 = 0.0;         // 1 when the nearest plate's closest edge is the slab outline
  for (int cj = -1; cj <= 1; cj++)
  for (int ci = -1; ci <= 1; ci++) {
    int k = (cj + 2) * 5 + (ci + 2);
    if (ok_[k] < 0.5) continue;
    vec2 sk = site[k];
    vec2 ok = field(sk / S).xy;
    ok *= step(1e-3, length(ok));   // drop the 8-bit encoding bias (~0.0003 uv)
    // rim plates never retreat into the slab: the inward push is reflected outward, plus a small
    // heave with local intensity, so the margin bulges and slides over the mud near the cursor
    vec2 su = sk / S;
    float e = 1.0 / S;
    float Is = field(su).z;
    if (su.x < e)       ok.x = -abs(ok.x) * 1.6 - 0.018 * Is;
    if (su.x > 1.0 - e) ok.x =  abs(ok.x) * 1.6 + 0.018 * Is;
    if (su.y < e)       ok.y = -abs(ok.y) * 1.6 - 0.018 * Is;
    if (su.y > 1.0 - e) ok.y =  abs(ok.y) * 1.6 + 0.018 * Is;
    ok = clamp(ok, -0.06, 0.06);   // stay within the 3x3 plate search when sliding over the mud
    vec2 Y = X - ok * S;
    // moved plates get a ragged outer face; unmoved ones keep the exact straight edge (pristine at rest)
    vec2 rag = 0.007 * (vec2(vnoise(lp * 30.0), vnoise(lp * 30.0 + 3.0)) - 0.5) * clamp(length(ok) * 60.0, 0.0, 1.0);
    float sdClip = sdBox(lp - ok + rag) * S;
    float sd = -1e3;
    for (int nj = -1; nj <= 1; nj++)
    for (int ni = -1; ni <= 1; ni++) {
      if (ni == 0 && nj == 0) continue;
      int j2 = k + nj * 5 + ni;
      if (ok_[j2] < 0.5) continue;
      vec2 sj = site[j2];
      sd = max(sd, dot(Y - 0.5 * (sk + sj), normalize(sj - sk)));
    }
    float rimE = smoothstep(-0.5 * pxL0, 0.5 * pxL0, sdClip - sd);
    sdV1 = min(sdV1, sd);
    sd = max(sd, sdClip);
    if (sd < sd1) { sd2 = sd1; o2 = o1; clip2 = clip1; s2 = s1; sd1 = sd; o1 = ok * S; clip1 = sdClip; s1 = sk; rimEdge1 = rimE; }
    else if (sd < sd2) { sd2 = sd; o2 = ok * S; clip2 = sdClip; s2 = sk; }
  }
  // rim plates never retreat, so every gap is between two plates (no rim wall)
  float pxL = pxL0;

  float cover = 1.0 - smoothstep(-pxL, pxL, sd1);
  float heat = smoothstep(0.05, 0.7, I);
  float G = max(sd1 + max(sd2, 0.0), 1e-5);           // gap width (lattice units)
  float rockIn = step(sd1, 0.0);
  float dEdge = -sd1;

  // --- rock: faint heat only beside real gaps
  float notRim = 1.0 - rimEdge1;   // no heat / rim crack along the slab outline itself
  vec3 rock = vec3(0.09, 0.009, 0.0) * exp(min(sd1, 0.0) / 0.03) * I * I * smoothstep(0.0, 3.0 * pxL, G) * notRim;

  // --- hairline fractures that ride with the plate: open, branching, tapered tips
  vec2 Yl = X - o1;
  float eh = voronoiEdgeFree(Yl * 2.4 + 3.3) / 2.4;
  float wh = smoothstep(0.5, 1.0, I) * 0.03 * (0.4 + vnoise(Yl * 6.0))
           * smoothstep(0.28, 0.55, vnoise(Yl * 3.0 + 1.7));
  float hm = (1.0 - smoothstep(wh - pxL, wh + pxL, eh)) * smoothstep(0.5 * pxL, 1.5 * pxL, wh);
  hm *= smoothstep(0.0, 3.0 * pxL, dEdge);
  rock = mix(rock, magmaRamp(0.35 + 0.65 * pow(eh / max(wh, 1e-4), 0.6), heat * 0.8), hm * rockIn);

  // --- one crack per plate boundary (gap + thin rim crack), single profile from the gap centerline
  float bw = smoothstep(0.55, 0.95, I) * 0.018 * (0.6 + 0.8 * vnoise(X * 5.0))
           * smoothstep(0.3, 0.6, vnoise(X * 2.0 + 4.1)) * (sd1 > 0.0 ? 1.0 : notRim);
  float hw = 0.5 * G + bw;
  float dc = abs(sd1 - 0.5 * G);
  float cov = (1.0 - smoothstep(hw - pxL, hw + pxL, dc)) * smoothstep(0.5 * pxL, 1.5 * pxL, hw);
  float flow = fbm(lp * 40.0 + vec2(uTime * 0.35, -uTime * 0.6));
  float gheat = heat * mix(0.7, 1.0, smoothstep(0.0, 0.12, G));
  vec3 lava = magmaRamp(dc / max(hw, 1e-4), gheat)
            * mix(1.0, 0.75 + 0.5 * flow, smoothstep(pxL, 4.0 * pxL, G));
  vec3 slab = mix(rock, lava, cov);

  // Magma only lies beneath the original footprint; outside it, uncovered ground is mud,
  // shadowed by whichever plates have slid out over it.
  // Outside the original footprint, magma still fills any gap *between* plates (e.g. behind a
  // corner that slid out), bulging into the mud with a rounded, cooler meniscus where the gap
  // opens wide toward the outside. Open ground with no plate across it stays mud.
  // Only a gap the two plates actually opened by moving apart (width ~ |o1 - o2|) gets magma, so
  // unmoved neighbours along the rim never produce a line, and the gap's mouth rounds off into mud.
  float Gp = sd1 + max(sd2, 0.0);
  // separation perpendicular to the shared boundary only (sliding past each other opens nothing)
  float D = clamp(dot(o1 - o2, normalize(s1 - s2 + 1e-5)), 0.0, 0.55);
  float outMask = sd1 > 0.0 ? 1.0 - smoothstep(0.75 * D, 1.25 * D + pxL, Gp) : 0.0;
  outMask *= smoothstep(1.5 * pxL, 4.0 * pxL, D);
  // never bulge beyond the outer face of the plate that slid out furthest
  outMask *= 1.0 - smoothstep(0.0, 0.25 * D + pxL, min(clip1, clip2));
  float dcP = abs(sd1 - 0.5 * Gp) / max(0.5 * Gp, 1e-4);
  vec3 lavaP = magmaRamp(max(dcP, 1.0 - smoothstep(0.0, 0.7, outMask)), gheat)
             * mix(1.0, 0.75 + 0.5 * flow, smoothstep(pxL, 4.0 * pxL, Gp));
  vec3 ground = mudC * mix(0.45, 1.0, smoothstep(0.0, 0.06, max(sd1, 0.0) / S));
  vec3 outside = mix(mix(ground, lavaP, outMask), rock, cover);
  // carry inside cracks a few px past the old footprint line and fade, so there is no seam there
  float dOut = max(sdSq, 0.0) * S;
  float carry = (1.0 - smoothstep(0.0, 4.0 * pxL + 0.3 * D, dOut)) * cov * smoothstep(0.0, pxL, sdV1)   // pixel really lies between moved cells
              * smoothstep(1.5 * pxL, 4.0 * pxL, D);   // only real openings, never along an unmoved rim
  col = mix(outside, slab, max(inside, carry));
  fragColor = vec4(pow(col, vec3(0.92)), 1.0);
}
</script>

<script>
(() => {
  const MAX_PTS = 96;      // 2 x 96 vec4 uniforms, under WebGL2's guaranteed 224
  const FIELD_RES = 160;
  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl2', { antialias: false, premultipliedAlpha: false, preserveDrawingBuffer: true });
  if (!gl) { document.getElementById('err').style.display = 'grid'; return; }

  const src = id => document.getElementById(id).textContent;
  const fragSrc = id => '#version 300 es\nprecision highp float;\n' + src('common') + src(id);
  function compile(type, s) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, s.trim());
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  }
  function program(fs, names) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, src('vs')));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.bindAttribLocation(p, 0, 'aPos');
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const U = {};
    for (const n of names) U[n] = gl.getUniformLocation(p, n);
    return { p, U };
  }
  const fieldProg = program(fragSrc('fs-field'), ['uFieldRes', 'uTime', 'uPts', 'uVel', 'uCount']);
  const mainProg = program(fragSrc('fs'), ['uRes', 'uSq', 'uTime', 'uField']);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  // field render target (RGBA8, linear filtered)
  const fieldTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, fieldTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, FIELD_RES, FIELD_RES, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fieldTex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  // ---------- layout ----------
  let dpr = 1, W = 0, H = 0, idleFrames = 0;
  const sq = { cx: 0, cy: 0, half: 0 };   // CSS px, y down
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    sq.half = Math.min(W, H) * 0.37;
    sq.cx = W / 2; sq.cy = H / 2;
    idleFrames = 0;
  }
  addEventListener('resize', resize);
  resize();

  const toLocal = (x, y) => [
    (x - (sq.cx - sq.half)) / (2 * sq.half),
    1 - (y - (sq.cy - sq.half)) / (2 * sq.half),
  ];
  const isInside = (u, v) => u >= 0 && u <= 1 && v >= 0 && v <= 1;

  // ---------- trail of influence points ----------
  // Each point: opens, holds briefly, then glues back with an eased delay.
  const ATTACK = 0.26, HOLD = 0.32, HEAL = 1.35, LIFESPAN = ATTACK + HOLD + HEAL;
  const pts = [];  // {x, y, born, r, dx, dy}
  let lastSpawned = null;
  const riseOf = age => { const a = Math.min(Math.max(age / ATTACK, 0), 1); return a * a * (3 - 2 * a); };
  function life(age) {
    if (age < 0) return 0;
    const h = Math.min(Math.max((age - HOLD) / HEAL, 0), 1);
    return riseOf(age) * (1 - h * h * (3 - 2 * h));
  }
  function spawn(x, y, now) {
    // radius from a position hash (not Math.random) so re-touching a spot is stable
    const hr = Math.abs(Math.sin(x * 127.1 + y * 311.7) * 43758.5453) % 1;
    const p = { x, y, born: now, r: 0.14 + hr * 0.07, dx: 0, dy: 0 };
    lastSpawned = p;
    if (pts.length < MAX_PTS) { pts.push(p); return; }
    // full: replace the point with the least remaining life, never one still opening/holding
    let k = 0, best = Infinity;
    for (let i = 0; i < pts.length; i++) {
      const a = now - pts[i].born;
      const score = a < ATTACK + HOLD ? 2 - a : life(a);
      if (score < best) { best = score; k = i; }
    }
    pts[k] = p;
  }

  // ---------- pointer ----------
  const ptr = { u: -1, v: -1, inside: false, lastSpawnU: -9, lastSpawnV: -9, lastSpawnT: 0, vx: 0, vy: 0, lastT: 0 };
  const nowS = () => performance.now() / 1000;
  function onMove(e) {
    const now = nowS();
    const [u, v] = toLocal(e.clientX, e.clientY);
    const dt = Math.max(now - ptr.lastT, 1e-3);
    if (ptr.lastT && ptr.u > -1) {
      ptr.vx += ((u - ptr.u) / dt - ptr.vx) * 0.35;
      ptr.vy += ((v - ptr.v) / dt - ptr.vy) * 0.35;
    }
    const wasInside = ptr.inside;
    ptr.inside = isInside(u, v);
    // leaving: drop one last point at the exit so it heals with the same delay
    if (wasInside && !ptr.inside) {
      const eu = Math.min(Math.max(u, 0), 1), ev = Math.min(Math.max(v, 0), 1);
      spawn(eu, ev, now);
      ptr.lastSpawnU = eu; ptr.lastSpawnV = ev; ptr.lastSpawnT = now;
    }
    ptr.u = u; ptr.v = v; ptr.lastT = now;
  }
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerdown', onMove);
  const leave = () => {
    if (ptr.inside) { spawn(ptr.u, ptr.v, nowS()); ptr.lastSpawnU = ptr.u; ptr.lastSpawnV = ptr.v; }
    ptr.inside = false; ptr.u = -1; ptr.v = -1; ptr.lastT = 0;
  };
  canvas.addEventListener('pointerleave', leave);
  canvas.addEventListener('pointercancel', leave);

  // ---------- render loop ----------
  const ptsArr = new Float32Array(MAX_PTS * 4);
  const velArr = new Float32Array(MAX_PTS * 4);
  const t0 = nowS();
  let lastFrame = t0;

  function frame() {
    const now = nowS();
    const dt = Math.min(now - lastFrame, 0.1);
    lastFrame = now;
    const vDecay = Math.exp(-dt * 6);
    ptr.vx *= vDecay; ptr.vy *= vDecay;

    if (ptr.inside) {
      const moved = Math.hypot(ptr.u - ptr.lastSpawnU, ptr.v - ptr.lastSpawnV);
      // spacing grows with speed so the buffer always holds a full lifespan of trail
      const speed = Math.hypot(ptr.vx, ptr.vy);
      const minStep = Math.min(Math.max(0.022, speed * LIFESPAN / (MAX_PTS - 12)), 0.07);
      if (moved > minStep) {
        spawn(ptr.u, ptr.v, now);
        ptr.lastSpawnU = ptr.u; ptr.lastSpawnV = ptr.v; ptr.lastSpawnT = now;
      } else if (lastSpawned && pts.includes(lastSpawned)) {
        // resting: keep the newest point fully open instead of stacking new ones (no popping)
        lastSpawned.born = Math.max(lastSpawned.born, now - ATTACK - HOLD * 0.5);  // never ages past mid-hold
      } else {
        spawn(ptr.u, ptr.v, now);
        ptr.lastSpawnU = ptr.u; ptr.lastSpawnV = ptr.v; ptr.lastSpawnT = now;
      }
    }

    const spring = 1 - Math.exp(-dt * 5);
    let n = 0;
    for (const p of pts) {
      const l = life(now - p.born);
      if (l <= 0.0005) continue;
      // elastic drag: plates near the trail are pulled toward the live cursor, spring back when it leaves
      let tx = 0, ty = 0;
      if (ptr.inside) {
        tx = ptr.u - p.x; ty = ptr.v - p.y;
        const len = Math.hypot(tx, ty), maxL = 0.07;
        if (len > maxL) { tx *= maxL / len; ty *= maxL / len; }
        tx *= 0.4; ty *= 0.4;
      }
      p.dx += (tx - p.dx) * spring; p.dy += (ty - p.dy) * spring;
      // radius grows while opening, so cracks spread outward from the cursor
      const r = p.r * (0.35 + 0.65 * riseOf(now - p.born));
      ptsArr.set([p.x, p.y, l, r], n * 4);
      velArr.set([p.dx, p.dy, 0, 0], n * 4);
      n++;
    }

    // nothing alive and the last frames already showed the untouched slab: skip redundant redraws
    idleFrames = n === 0 ? idleFrames + 1 : 0;
    if (idleFrames > 2) { schedule(); return; }

    const t = now - t0;
    // pass 1: plate-motion field
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.viewport(0, 0, FIELD_RES, FIELD_RES);
    gl.useProgram(fieldProg.p);
    gl.uniform2f(fieldProg.U.uFieldRes, FIELD_RES, FIELD_RES);
    gl.uniform1f(fieldProg.U.uTime, t);
    gl.uniform4fv(fieldProg.U.uPts, ptsArr);
    gl.uniform4fv(fieldProg.U.uVel, velArr);
    gl.uniform1i(fieldProg.U.uCount, n);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // pass 2: scene
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(mainProg.p);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, fieldTex);
    gl.uniform1i(mainProg.U.uField, 0);
    gl.uniform2f(mainProg.U.uRes, canvas.width, canvas.height);
    gl.uniform3f(mainProg.U.uSq, sq.cx * dpr, (H - sq.cy) * dpr, sq.half * dpr);
    gl.uniform1f(mainProg.U.uTime, t);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    schedule();
  }
  // rAF stalls in hidden/background tabs; fall back to a timer so the page still renders there
  const schedule = () => document.hidden ? setTimeout(frame, 33) : requestAnimationFrame(frame);
  schedule();
})();
</script>
</body>
</html>
